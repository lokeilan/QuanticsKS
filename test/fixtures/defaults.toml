# Expected public option defaults.
[accuracy]
algebra_tolerance = 1.0e-12
density_tolerance = 1.0e-10
external_tolerance = 1.0e-12
field_cap = 64
field_tolerance = 1.0e-8
green_rhs_tolerance = 1.0e-9
kernel_tolerance = 1.0e-12
orbital_cap = 48
orthogonalization_tolerance = 1.0e-11
pack_attempts = 4
pack_gram_tolerance = 1.0e-7
storage_tolerance = 1.0e-8
work_cap = 96
work_tolerance = 1.0e-6
xc_energy_tolerance = 1.0e-10

[audit]
algebra_tolerance = 1.0e-13
charge_tolerance = 1.0e-6
field_tolerance = 1.0e-9
gram_tolerance = 1.0e-6
kernel_tolerance = 1.0e-13
rank_multiplier = 2

[drive]
kind = "none"

[grid]
R = 16
cell = 400.0

[guess]
envelope_amplitude = 0.5
slow_cosine_amplitude = 0.005
slow_cosine_mode = 1
slow_sine_amplitude = 0.003
slow_sine_mode = 3
wavevectors = []

[physics]
exchange_quadrature_rtol = 2.0e-11
xc_density_max = 4.0
xc_density_min = 1.0e-8
xc_table_points = 2048

[refinement]
degree = 5
max_added_bits = 8
tolerance = 1.0e-11

[run]
blas_threads = 1
kind = "scf"

[scf]
anderson = true
anderson_coefficient_limit = 5.0
anderson_history = 5
anderson_regularization = 1.0e-6
coefficient_sweeps = 2
constraint_absolute_cutoff = 1.0e-12
constraint_relative_cutoff = 1.0e-10
criterion = "energy"
density_tolerance = 0.0001
eigen_tolerance = 0.0001
energy_tolerance = 1.0e-6
gram_tolerance = 1.0e-6
green_polish_every = 5
green_polish_residual = 0.1
green_shift = 0.5
independence_threshold = 1.0e-8
inner_steps = 1
max_iterations = 100
metric_absolute_cutoff = 1.0e-13
metric_relative_cutoff = 1.0e-11
mixing = 0.3
orthogonalize_threshold = 1.0e-8
seed = 20261030
tangent_absolute_cutoff = 1.0e-12
tangent_relative_cutoff = 1.0e-7

[system]
coupling = 1.0
distance = 4.0
kind = "hydrogen_chain"
mass = 1.0
natoms = 100
offset = 0.0
softening = 1.0
xc = "lsda"

[tci]
check_history = 2
environment_cache_bits = 10
global_pivot_search = 5
initial_pivots = []
initial_random_pivots = 6
max_global_pivots = 5
max_iterations = 16
orbital_cache_capacity = 8192
post_rounding_factor = 0.1
require_convergence = false
scalar_cache_capacity = 16384
zero_check_limit = 4096

[time]
dt = 0.01
gram_drift_limit = 1.0e-5
kinetic_cap = 96
kinetic_tolerance = 1.0e-12
norm_drift_limit = 1.0e-5
observe_every = 1
output_cap = 48
output_tolerance = 1.0e-12
phase_cap = 48
phase_tolerance = 1.0e-10
seed = 20261031
snapshot_every = 10
steps = 100
