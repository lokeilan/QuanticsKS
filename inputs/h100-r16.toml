# One-dimensional periodic H100 R16 SCF.
[run]
kind = "scf"
blas_threads = 8

[grid]
R = 16
cell = 400.0

[system]
kind = "hydrogen_chain"
natoms = 100
distance = 4.0

[accuracy]
field_tolerance = 1e-8
work_tolerance = 1e-6
storage_tolerance = 1e-8
algebra_tolerance = 1e-12
orthogonalization_tolerance = 1e-11
mixing_tolerance = 1e-12
density_residual_tolerance = 1e-12
green_rhs_tolerance = 1e-9
green_rhs_cap = 128
orbital_cap = 48
work_cap = 96
field_cap = 128

[scf]
criterion = "energy"
energy_tolerance = 1e-6
max_iterations = 80
mixing = 0.3
eigen_tolerance = 5e-5
density_tolerance = 5e-5
seed = 20261030

[tci]
environment_cache_bits = 8

[refinement]
degree = 5
tolerance = 1e-11
max_added_bits = 8
