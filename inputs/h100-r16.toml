# Periodic 1D H100 baseline: tight orbital output and dielectric density mixing.
# Use Julia --threads=4,1 and one BLAS thread.
[run]
kind = "scf"
blas_threads = 1

[grid]
R = 16
cell = 400.0

[system]
kind = "hydrogen_chain"
natoms = 100
distance = 4.0

[accuracy]
adaptive = false
field_tolerance = 5e-09
orbital_tolerance = 1e-12
orthogonalization_tolerance = 1e-12
storage_tolerance = 1e-12
storage_compression_attempts = 1
work_tolerance = 1e-06
algebra_tolerance = 1e-12
kinetic_action_tolerance = 3e-08
green_rhs_tolerance = 1e-08
mixing_tolerance = 1e-08
density_tolerance = 5e-09
xc_energy_tolerance = 5e-08
external_tolerance = 1e-08
kernel_tolerance = 1e-09
orbital_cap = 64
work_cap = 64
green_rhs_cap = 64
field_cap = 64
external_cap = 32
kernel_cap = 16
hartree_cap = 64
effective_potential_cap = 64
density_cap = 72
xc_energy_cap = 72

[scf]
extra_orbitals = 6
parallel_tasks = 4
energy_tolerance = 5e-06
max_iterations = 60
mixing = 0.7
adaptive_mixing = true
dielectric_susceptibility = 2.0
dielectric_tolerance = 1e-4
dielectric_max_iterations = 40
eigen_tolerance = 0.0005
orbital_residual_tolerance = 0.0003
density_tolerance = 1e-6
metric_relative_cutoff = 1e-08
seed = 20261030
green_update_interval = 1
inner_steps = 1
coefficient_sweeps = 2

[tci]
environment_cache_max_bytes = 8388608
orbital_cache_max_bytes = 134217728

[physics]
exchange_quadrature_rtol = 2e-09

[audit]
rank_multiplier = 1
